<svg width="680" height="900" viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Tmap AppKey 발급 순서</title>
<desc>openapi.sk.com에서 Tmap AppKey를 발급받는 8단계 순서도</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="900" fill="#FFFFFF"/>
<rect x="20" y="20" width="640" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="51" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#04342C">Tmap AppKey 발급받기 (openapi.sk.com)</text>

<!-- step template positions -->
<!-- step 1 -->
<circle cx="60" cy="120" r="20" fill="#0F6E56"/>
<text x="60" y="127" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">1</text>
<rect x="100" y="95" width="560" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="120" y="115" font-family="sans-serif" font-size="14" fill="#2C2C2A" font-weight="bold">openapi.sk.com 접속 (PC 권장)</text>
<text x="120" y="134" font-family="sans-serif" font-size="12" fill="#5F5E5A">주소창에 openapi.sk.com 입력해서 이동</text>

<line x1="60" y1="150" x2="60" y2="180" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- step 2 -->
<circle cx="60" cy="210" r="20" fill="#0F6E56"/>
<text x="60" y="217" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">2</text>
<rect x="100" y="185" width="560" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="120" y="205" font-family="sans-serif" font-size="14" fill="#2C2C2A" font-weight="bold">우측 상단 "로그인" → Tmap 계정으로 로그인</text>
<text x="120" y="224" font-family="sans-serif" font-size="12" fill="#5F5E5A">별도 회원가입 필요 없음, 쓰던 Tmap 계정 그대로</text>

<line x1="60" y1="240" x2="60" y2="270" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- step 3 -->
<circle cx="60" cy="300" r="20" fill="#0F6E56"/>
<text x="60" y="307" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">3</text>
<rect x="100" y="275" width="560" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="120" y="295" font-family="sans-serif" font-size="14" fill="#2C2C2A" font-weight="bold">로그인 후 "대시보드" 이동 → 메뉴에서 "앱" 클릭</text>
<text x="120" y="314" font-family="sans-serif" font-size="12" fill="#5F5E5A">좌측 또는 상단 메뉴에 있음</text>

<line x1="60" y1="330" x2="60" y2="360" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- step 4 -->
<circle cx="60" cy="390" r="20" fill="#0F6E56"/>
<text x="60" y="397" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">4</text>
<rect x="100" y="365" width="560" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="120" y="385" font-family="sans-serif" font-size="14" fill="#2C2C2A" font-weight="bold">"앱 만들기" 클릭</text>
<text x="120" y="404" font-family="sans-serif" font-size="12" fill="#5F5E5A">앱명은 자유 입력(예: 내차TmapNda), 이용 API는 Tmap, 요금제는 무료</text>

<line x1="60" y1="420" x2="60" y2="450" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- step 5 - important -->
<circle cx="60" cy="490" r="20" fill="#BA7517"/>
<text x="60" y="497" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">5</text>
<rect x="100" y="455" width="560" height="70" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
<text x="120" y="478" font-family="sans-serif" font-size="14" fill="#412402" font-weight="bold">⚠ 만든 앱이 "비활성화" 상태면 반드시 켜주기</text>
<text x="120" y="497" font-family="sans-serif" font-size="12" fill="#633806">만든 앱 → 설정 → 앱 상태 → 활성화로 전환</text>
<text x="120" y="514" font-family="sans-serif" font-size="12" fill="#633806">이 단계를 빠뜨리면 나중에 앱에서 키를 넣어도 안 됩니다</text>

<line x1="60" y1="530" x2="60" y2="560" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- step 6 -->
<circle cx="60" cy="590" r="20" fill="#0F6E56"/>
<text x="60" y="597" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">6</text>
<rect x="100" y="565" width="560" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="120" y="585" font-family="sans-serif" font-size="14" fill="#2C2C2A" font-weight="bold">PRODUCTS 메뉴 → API 사용요금 → Free 선택</text>
<text x="120" y="604" font-family="sans-serif" font-size="12" fill="#5F5E5A">"신청하기" → "앱 신청" 클릭</text>

<line x1="60" y1="620" x2="60" y2="650" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- step 7 -->
<circle cx="60" cy="680" r="20" fill="#0F6E56"/>
<text x="60" y="687" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">7</text>
<rect x="100" y="655" width="560" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="120" y="675" font-family="sans-serif" font-size="14" fill="#2C2C2A" font-weight="bold">앱 목록에서 방금 만든 앱 클릭 → "APP Key" 옆 복사 아이콘</text>
<text x="120" y="694" font-family="sans-serif" font-size="12" fill="#5F5E5A">보통 즉시~몇 분 내 승인됩니다</text>

<line x1="60" y1="710" x2="60" y2="740" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- step 8 -->
<circle cx="60" cy="770" r="20" fill="#0F6E56"/>
<text x="60" y="777" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">8</text>
<rect x="100" y="745" width="560" height="70" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="120" y="768" font-family="sans-serif" font-size="14" fill="#2C2C2A" font-weight="bold">TmapNda 앱 최초 실행 화면의 앱키 입력란에 붙여넣기 → 저장</text>
<text x="120" y="787" font-family="sans-serif" font-size="12" fill="#5F5E5A">이미 한 번 실행했다면 ≡ 메뉴 → "설정"을 길게 누르면 이 화면으로 다시 이동</text>
<text x="120" y="804" font-family="sans-serif" font-size="12" fill="#5F5E5A">앱 완전 종료 후 재실행 → 상단바에 "Comma 연결됨" 표시 확인</text>

<rect x="20" y="840" width="640" height="45" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="340" y="860" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#501313" font-weight="bold">안 될 때: ① 앱키 복사 시 글자 빠짐 없는지 ② 폰-콤마 같은 네트워크인지 ③ 앱 재실행했는지</text>
</svg>
