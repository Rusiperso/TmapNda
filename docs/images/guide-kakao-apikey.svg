<svg width="680" height="980" viewBox="0 0 680 980" xmlns="http://www.w3.org/2000/svg" role="img">
<title>카카오 API 키 발급 순서</title>
<desc>developers.kakao.com에서 REST API 키와 Native App Key를 발급받는 순서도, 놓치기 쉬운 두 가지 필수 설정 포함</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="980" fill="#FFFFFF"/>
<rect x="20" y="20" width="640" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="51" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#26215C">카카오 API 키 발급받기 (developers.kakao.com)</text>

<circle cx="60" cy="120" r="20" fill="#534AB7"/>
<text x="60" y="127" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">1</text>
<rect x="100" y="95" width="560" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="120" y="115" font-family="sans-serif" font-size="14" fill="#2C2C2A" font-weight="bold">developers.kakao.com 접속 (PC 권장) → 로그인</text>
<text x="120" y="134" font-family="sans-serif" font-size="12" fill="#5F5E5A">카카오 계정으로 로그인</text>

<line x1="60" y1="150" x2="60" y2="180" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow2)"/>

<circle cx="60" cy="210" r="20" fill="#534AB7"/>
<text x="60" y="217" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">2</text>
<rect x="100" y="185" width="560" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="120" y="205" font-family="sans-serif" font-size="14" fill="#2C2C2A" font-weight="bold">상단 메뉴 "내 애플리케이션" → "애플리케이션 추가하기"</text>
<text x="120" y="224" font-family="sans-serif" font-size="12" fill="#5F5E5A">앱 이름은 자유(예: TmapNda), 사업자명은 개인이면 이름 등 아무 문자열</text>

<line x1="60" y1="240" x2="60" y2="270" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow2)"/>

<circle cx="60" cy="300" r="20" fill="#534AB7"/>
<text x="60" y="307" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">3</text>
<rect x="100" y="275" width="560" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="120" y="295" font-family="sans-serif" font-size="14" fill="#2C2C2A" font-weight="bold">생성된 앱 카드 클릭 → 상세 화면 진입</text>
<text x="120" y="314" font-family="sans-serif" font-size="12" fill="#5F5E5A">별도 심사 없이 즉시 생성됩니다</text>

<line x1="60" y1="330" x2="60" y2="360" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="20" y="360" width="640" height="8" fill="#D4537E"/>
<text x="340" y="392" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4B1528" font-weight="bold">여기부터 두 가지 필수 설정 - 하나라도 빠지면 검색·길안내 작동 안 함</text>

<!-- 4-1 -->
<rect x="30" y="410" width="620" height="140" rx="10" fill="#FBEAF0" stroke="#D4537E" stroke-width="1.5"/>
<circle cx="65" cy="440" r="18" fill="#D4537E"/>
<text x="65" y="446" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold">4a</text>
<text x="95" y="435" font-family="sans-serif" font-size="14" fill="#4B1528" font-weight="bold">플랫폼(앱 키) 등록</text>
<text x="95" y="453" font-family="sans-serif" font-size="12" fill="#72243E">좌측 메뉴 "앱 → 앱 키"(또는 "플랫폼 키") → Default Native AppKey 클릭</text>
<rect x="65" y="470" width="540" height="65" rx="6" fill="#FFFFFF" stroke="#ED93B1" stroke-width="1"/>
<text x="85" y="490" font-family="sans-serif" font-size="12" fill="#4B1528" font-weight="bold">패키지명 :</text>
<text x="180" y="490" font-family="monospace" font-size="12" fill="#4B1528">com.tmap.nda</text>
<text x="85" y="512" font-family="sans-serif" font-size="12" fill="#4B1528" font-weight="bold">키 해시 :</text>
<text x="170" y="512" font-family="monospace" font-size="11" fill="#4B1528">zQSvbNffsYGnbQksdHmIUbe10V0=</text>
<text x="85" y="530" font-family="sans-serif" font-size="11" fill="#72243E">→ 이 두 값을 정확히 입력하고 "저장"</text>

<!-- 4-2 -->
<rect x="30" y="565" width="620" height="100" rx="10" fill="#FBEAF0" stroke="#D4537E" stroke-width="1.5"/>
<circle cx="65" cy="595" r="18" fill="#D4537E"/>
<text x="65" y="601" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold">4b</text>
<text x="95" y="590" font-family="sans-serif" font-size="14" fill="#4B1528" font-weight="bold">카카오맵 쿼터 사용 체크</text>
<text x="95" y="608" font-family="sans-serif" font-size="12" fill="#72243E">좌측 메뉴 "앱 → 카카오맵" 클릭</text>
<text x="95" y="626" font-family="sans-serif" font-size="12" fill="#72243E">"쿼터 사용" 체크박스 켜고 "저장"</text>
<text x="95" y="648" font-family="sans-serif" font-size="11" fill="#993556">이 체크를 빠뜨리면 지도/검색 API가 막혀서 안 됩니다</text>

<line x1="60" y1="665" x2="60" y2="700" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow2)"/>

<circle cx="60" cy="730" r="20" fill="#534AB7"/>
<text x="60" y="737" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">5</text>
<rect x="100" y="695" width="560" height="70" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="120" y="718" font-family="sans-serif" font-size="14" fill="#2C2C2A" font-weight="bold">필요한 키 두 개 복사</text>
<text x="120" y="737" font-family="sans-serif" font-size="12" fill="#5F5E5A">REST API 키 → 목적지 검색(장소 검색)에 필요</text>
<text x="120" y="754" font-family="sans-serif" font-size="12" fill="#5F5E5A">Default Native AppKey → 카카오내비 길안내에 필요</text>

<line x1="60" y1="765" x2="60" y2="795" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow2)"/>

<circle cx="60" cy="825" r="20" fill="#534AB7"/>
<text x="60" y="832" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">6</text>
<rect x="100" y="800" width="560" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="120" y="822" font-family="sans-serif" font-size="14" fill="#2C2C2A" font-weight="bold">TmapNda 앱 최초 실행 화면의 키 입력란에 붙여넣기 → 저장</text>
<text x="120" y="841" font-family="sans-serif" font-size="12" fill="#5F5E5A">이미 한 번 실행했다면 ≡ 메뉴 → "설정"을 길게 누르면 이 화면으로 다시 이동</text>
<text x="120" y="856" font-family="sans-serif" font-size="12" fill="#5F5E5A">REST API 키, Native App Key 둘 다 각자의 칸에 붙여넣기</text>

<rect x="20" y="895" width="640" height="60" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="340" y="918" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#501313" font-weight="bold">목적지 검색·길안내가 안 되면 이 순서부터 다시 확인하세요</text>
<text x="340" y="938" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#791F1F">특히 4a(키 해시), 4b(쿼터 체크) 두 가지를 가장 많이 빠뜨립니다</text>
</svg>
