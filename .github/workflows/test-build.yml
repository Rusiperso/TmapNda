name: Test Build (pre-release)

# test-* 태그를 푸시하면 정식 릴리즈/디스코드 공지 없이
# 테스트 APK만 프리릴리즈로 올린다 (보드앱 "테스트 배포"용).
on:
  workflow_dispatch:
  push:
    tags:
      - 'test-*'
    branches:
      - 'claude/home-project-memory-gatwhs'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          USAGE_WEBHOOK_URL: ${{ secrets.USAGE_WEBHOOK_URL }}
          CRASH_WEBHOOK_URL: ${{ secrets.CRASH_WEBHOOK_URL }}

      - name: Decide test tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(grep 'versionName' app/build.gradle.kts | grep -oP '"\K[^"]*')
            TAG="test-${VERSION}-b${GITHUB_RUN_NUMBER}"
          fi
          echo "TEST_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/TmapNda-${TEST_TAG}.apk"

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TEST_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TEST_TAG }}
          files: app/build/outputs/apk/debug/TmapNda-*.apk
          prerelease: true
          make_latest: false
          body: test
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
