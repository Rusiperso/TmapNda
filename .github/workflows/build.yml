name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | grep -oP '"\K[^"]*')
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TmapNda-v${VERSION}.apk

      - name: Generate release notes from commit log
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1)
          echo "## 업데이트 내용 (${CURRENT_TAG})" > RELEASE_NOTES.md
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges >> RELEASE_NOTES.md
          else
            git log --pretty=format:"- %s" --no-merges >> RELEASE_NOTES.md
          fi
          echo "" >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/TmapNda-*.apk
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
