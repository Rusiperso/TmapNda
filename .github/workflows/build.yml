name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace > build_log.txt 2>&1
          echo "BUILD_EXIT=$?" >> "$GITHUB_ENV"
          tail -n 300 build_log.txt

      - name: Upload log on failure (temp diagnostic)
        if: env.BUILD_EXIT != '0'
        run: |
          git config user.name "diag-bot"
          git config user.email "diag-bot@users.noreply.github.com"
          git checkout --orphan diag-build-log
          git rm -rf --cached . > /dev/null 2>&1 || true
          tail -c 60000 build_log.txt > build_log_tail.txt
          git add build_log_tail.txt
          git commit -m "diag: build log"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" diag-build-log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if build failed
        if: env.BUILD_EXIT != '0'
        run: exit 1

      - name: Rename APK
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | grep -oP '"\K[^"]*')
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TmapNda-v${VERSION}.apk

      - name: Use RELEASE_NOTES.md as-is
        run: cat RELEASE_NOTES.md

      - name: Extract this version's release notes only
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | grep -oP '"\K[^"]*')
          awk -v ver="## v$VERSION" '
            $0==ver {flag=1; print; next}
            /^## v/ && flag {exit}
            flag {print}
          ' RELEASE_NOTES.md > THIS_VERSION_RELEASE_NOTES.md
          cat THIS_VERSION_RELEASE_NOTES.md

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/TmapNda-*.apk
          body_path: THIS_VERSION_RELEASE_NOTES.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Announce release to Discord
        continue-on-error: true
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_RELEASE_WEBHOOK secret not set - skipping Discord announcement"
            exit 0
          fi
          VERSION=$(grep 'versionName' app/build.gradle.kts | grep -oP '"\K[^"]*')
          NOTES=$(head -c 1500 THIS_VERSION_RELEASE_NOTES.md)
          MESSAGE=$(printf '🚀 **TmapNda v%s** 업데이트\n\n%s' "$VERSION" "$NOTES")
          jq -n --arg content "$MESSAGE" '{content: $content}' | \
            curl -sS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
