name: Compile Check (no release)

# 컴파일이 되는지만 확인한다. 릴리즈·프리릴리즈·디스코드 공지 없음.
# .github/compile.trigger 파일을 고쳐서 푸시할 때만 돈다.
on:
  push:
    branches:
      - 'claude/home-project-memory-gatwhs'
    paths:
      - '.github/compile.trigger'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: chmod +x gradlew
      - name: Compile (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace -q 2>&1 | tail -n 150
